# tooli: the whole MERN stack for DEVELOPMENT, with one command:
#   docker compose up --build
# Then open http://localhost:5173. Stop with: docker compose down
# Settings come from .env (copy .env.example); every value has a default, so .env is optional.

name: tooli

services:
  # React + Vite dev server, with hot reload
  client:
    build: ./client
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    environment:
      # Vite forwards /api/* here (see client/vite.config.js)
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://server:5000}
      # Needed for hot reload with a mounted folder on Windows/macOS
      WATCH_POLLING: "true"
    volumes:
      - ./client:/app # your code, live
      - /app/node_modules # ...but keep the container's own node_modules
    # npm install at every start: the node_modules volume above outlives image rebuilds, so without this
    # a new package (e.g. after git pull) would be missing in the container. Takes a second when nothing changed.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    # depends_on:
    #   - server # uncomment together with the server service below

  # ---------------------------------------------------------------------------------------
  # Express API: NOT CREATED YET. When the server/ folder exists (with a Dockerfile that
  # starts Express on port 5000), uncomment this service and the depends_on lines above.
  # Until then the frontend uses its fake services, so the app works without it.
  # ---------------------------------------------------------------------------------------
  # server:
  #   build: ./server
  #   ports:
  #     - "127.0.0.1:${SERVER_PORT:-5000}:5000" # this computer only (see the mongo note)
  #   environment:
  #     PORT: 5000
  #     NODE_ENV: development
  #     MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/tooli}
  #     JWT_SECRET: ${JWT_SECRET:-change-me-in-your-env-file}
  #   volumes:
  #     - ./server:/app
  #     - /app/node_modules
  #   depends_on:
  #     - mongo

  # MongoDB database. Data lives in the "mongo-data" volume, so it survives restarts.
  mongo:
    image: mongo:8
    ports:
      # 127.0.0.1 = reachable from THIS computer only (Compass, mongosh). Without it, anyone on the
      # same Wi-Fi could connect to the database, which has no password in development.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
