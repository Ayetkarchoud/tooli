<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E1B4B" />
    <title>tooli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme/palette before React loads, so the page never flashes the wrong colours.
      // Same rules as src/theme/ThemeProvider.jsx: no saved theme = follow the system setting;
      // an unknown palette = blue. Keep PALETTES below in sync with src/theme/themeContext.js.
      (function () {
        var PALETTES = ['blue', 'yellow', 'green', 'red', 'violet'];
        var root = document.documentElement;
        var theme = null, palette = null;
        try {
          theme = localStorage.getItem('tooli-theme');
          palette = localStorage.getItem('tooli-palette');
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') root.dataset.theme = 'dark';
        // > 0: a known palette other than blue (blue, index 0, needs no attribute)
        if (PALETTES.indexOf(palette) > 0) root.dataset.palette = palette;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
