<!doctype html>
<!-- Old demo. The real tokens are in client/src/styles/tokens.css. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tooli palette demo</title>
<style>
/* ==========================================================
   tooli design tokens: THE single place to change colours.
   Change a value here → logo + whole site update.
   ========================================================== */

:root {
  /* 1. Brand palette (raw colours) */
  --brand-ink:        #1E1B4B;  /* navy: text, logo letters */
  --brand-primary:    #3B5BDB;  /* main colour: cap, buttons, links */
  --brand-accent:     #FBBF24;  /* second colour: tassel, highlights */
  --brand-on-primary: #FFFFFF;  /* text on top of primary (buttons) */
  --brand-white:      #FFFFFF;
  --brand-night:      #0F0E2A;  /* dark backgrounds */

  /* 2. Semantic tokens (what the site uses) */
  --color-bg:         #F4F5FB;
  --color-surface:    var(--brand-white);
  --color-text:       var(--brand-ink);
  --color-muted:      #6B6F8A;
  --color-primary:    var(--brand-primary);
  --color-on-primary: var(--brand-on-primary);
  --color-accent:     var(--brand-accent);
  --color-border:     #E3E5F0;

  /* 3. Logo tokens (used inside tooli-logo-theme.svg) */
  --logo-ink:     var(--brand-ink);
  --logo-primary: var(--brand-primary);
  --logo-accent:  var(--brand-accent);
  --logo-eye:     var(--brand-white);
}

/* ==========================================================
   Colour palettes: <html data-palette="...">
   Blue is the default (no attribute needed).
   ========================================================== */

[data-palette="yellow"] {
  --brand-primary:    #FACC15;
  --brand-accent:     #3B5BDB;
  --brand-on-primary: #1E1B4B;  /* dark text: white is unreadable on yellow */
}

[data-palette="green"] {
  --brand-primary:    #4ADE80;
  --brand-accent:     #FBBF24;
  --brand-on-primary: #1E1B4B;  /* dark text: white is unreadable on light green */
}

[data-palette="red"] {
  --brand-primary:    #F43F5E;
  --brand-accent:     #FBBF24;
  --brand-on-primary: #FFFFFF;
}

/* ==========================================================
   Dark mode: <html data-theme="dark">. Works with every palette.
   ========================================================== */

[data-palette="violet"] {
  --brand-primary:    #7C3AED;
  --brand-accent:     #FBBF24;
  --brand-on-primary: #FFFFFF;
}

[data-theme="dark"] {
  --color-bg:      var(--brand-night);
  --color-surface: #1A1940;
  --color-text:    var(--brand-white);
  --color-muted:   #A5A8C8;
  --color-border:  #2C2B5A;

  --logo-ink:     var(--brand-white);
  --logo-eye:     var(--brand-night);
}
body{margin:0;font-family:system-ui,sans-serif;background:var(--color-bg);color:var(--color-text)}
.wrap{max-width:720px;margin:auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.bar button{border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);padding:8px 14px;border-radius:10px;cursor:pointer;font:inherit;display:flex;gap:6px;align-items:center}
.bar i{width:14px;height:14px;border-radius:50%;display:inline-block}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:16px;padding:20px;margin-bottom:16px}
.logo{width:100%;max-width:420px;height:auto;display:block;margin:auto}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{background:var(--color-primary);color:var(--color-on-primary);border:0;padding:10px 18px;border-radius:10px;font:600 15px system-ui}
.tag{background:var(--color-accent);color:var(--brand-ink);padding:4px 10px;border-radius:99px;font:700 12px system-ui}
.muted{color:var(--color-muted);font-size:14px}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{font:12px ui-monospace,monospace;text-align:center}
.sw span{display:block;width:64px;height:40px;border-radius:8px;border:1px solid var(--color-border);margin-bottom:4px}
</style>
<script>/* tooli theme switcher: light/dark mode + colour palette.
   Uses the tokens in tokens.css.
   - Dark mode 1st visit: follows the user's system setting.
   - Choices are remembered for the next visit. */

(function () {
  const root = document.documentElement;
  const THEME_KEY = 'tooli-theme';
  const PALETTE_KEY = 'tooli-palette';

  function load(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  function applyTheme(theme) {
    if (theme === 'dark') root.dataset.theme = 'dark';
    else delete root.dataset.theme;
  }

  // "blue" is the default palette, so it needs no attribute
  function applyPalette(palette) {
    if (palette && palette !== 'blue') root.dataset.palette = palette;
    else delete root.dataset.palette;
  }

  // Run immediately so the page doesn't flash the wrong colours
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(load(THEME_KEY) || (systemDark ? 'dark' : 'light'));
  applyPalette(load(PALETTE_KEY));

  document.addEventListener('click', function (e) {
    //
    // <button data-theme-toggle>: switches light/dark
    if (e.target.closest('[data-theme-toggle]')) {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      save(THEME_KEY, next);
    }

    // <button data-palette-set="green">: picks a palette (blue, yellow, green, red, violet)
    const pick = e.target.closest('[data-palette-set]');
    if (pick) {
      applyPalette(pick.dataset.paletteSet);
      save(PALETTE_KEY, pick.dataset.paletteSet);
    }
  });
})();</script>
</head><body><div class="wrap">

</div>
